name: sync-upstream

# Keep the jkubo fork current with anthropics/claude-code.
#
# Pushes only when the rebase is clean. A conflicting day is deliberately left
# for a human: this tree is not watched, and a script that forces a conflicted
# rebase through would corrupt the fork delta silently, which is strictly worse
# than a red run nobody reads today and someone reads on Monday.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          # Full history: a rebase cannot replay against a shallow clone.
          fetch-depth: 0
          ref: jkubo

      - name: Configure identity
        run: |
          git config user.name  "Jay Kubo"
          git config user.email "6161465+jkubo@users.noreply.github.com"

      - name: Sync
        run: |
          chmod +x scripts/sync-upstream.sh
          ./scripts/sync-upstream.sh --push

      - name: Report
        if: failure()
        run: |
          echo "Rebase onto anthropics/claude-code conflicted, or main carried fork delta."
          echo "Nothing was pushed. Resolve locally:"
          echo "  ./scripts/sync-upstream.sh"
